# The ego-publish bundle patch: one insert adding the plugin row to a profile.
# A profile's own cordis.patch.yml may override the row's config by id `ego-publish`.
- insert:
    - id: ego-publish
      name: '@dsh-plugin/ego-publish'
      config:
        # Absolute path to the installed ego lite browser executable.
        # null/absent => auto-detect the standard Windows install location.
        egoPath: null
        # Runtime data root (accounts, isolated browser profiles, flows, runs).
        # null/absent => %USERPROFILE%\.dsh\ego-publish. Patch/env only: it decides
        # where the rest of the configuration lives.
        dataDir: null
        # Refuse a real publish unless the caller explicitly passes dryRun:false.
        requireExplicitPublish: true
        # Close an account browser after this many idle minutes (0 disables the sweeper).
        idleCloseMinutes: 30
        # How long a login hand-off waits for the human.
        loginTimeoutSec: 300
        # Per-action ceiling inside a page.
        actionTimeoutMs: 15000
        # Navigation ceiling.
        navigationTimeoutMs: 60000
        # Refresh Sohu 积分 (points) for signed-in accounts every N minutes (0 disables).
        pointsRefreshMinutes: 0
        # After a real publish, wait this many minutes before checking the link and sampling points.
        linkCheckDelayMinutes: 60
        # Shenlong HTTP extraction URL (contains key & sign). null disables proxy extraction.
        proxyApiUrl: null
        # Add this machine's public IP to the Shenlong whitelist before extracting.
        proxyApiWhitelist: true
